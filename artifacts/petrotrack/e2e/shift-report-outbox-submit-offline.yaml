appId: petrotrack.replit.app
---
# The runner disables connectivity before invoking this flow. The report is
# therefore written to the device outbox before the request can be acknowledged.
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: shift-tab-submit
    timeout: 30000
- tapOn:
    id: shift-tab-submit
- tapOn:
    id: report-business-date
- tapOn:
    id: report-business-date-day-${PETROTRACK_TEST_DATE}
- tapOn:
    id: shift-closing-meter
- inputText: ${PETROTRACK_TEST_CLOSING_METER}
- tapOn:
    id: shift-payment-cash
- inputText: "1"
- tapOn:
    id: shift-note
- inputText: ${PETROTRACK_TEST_NOTE}
- tapOn: Submit to Manager
- extendedWaitUntil:
    visible: Shift Report Queued
    timeout: 30000
- tapOn: OK
- tapOn:
    id: shift-tab-history
- extendedWaitUntil:
    visible: Queued
    timeout: 30000
- tapOn: ${PETROTRACK_TEST_PUMP}
- extendedWaitUntil:
    visible: ${PETROTRACK_TEST_NOTE}
    timeout: 30000