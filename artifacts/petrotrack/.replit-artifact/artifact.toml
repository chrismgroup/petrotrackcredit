kind = "mobile"
previewPath = "/"
title = "Gastsmarts"
version = "1.0.0"
id = "artifacts/petrotrack"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 26086

[services.development]
run = "pnpm --filter @workspace/petrotrack run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/petrotrack", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/petrotrack", "run", "serve" ]

[services.env]
PORT = "26086"
BASE_PATH = "/"
