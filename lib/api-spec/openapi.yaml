openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: VesselMarketplace
    description: Nigerian Vessel Marketplace — auth, vessel listings, and charter party management.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  # ── Vessel Marketplace Auth ───────────────────────────────────────────────
  /vessels/auth/register:
    post:
      tags: [VesselMarketplace]
      operationId: vmRegister
      summary: Register a new marketplace user
      description: Creates a new account with role client, broker, or owner. Returns a scoped JWT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VmRegisterRequest'
      responses:
        '201':
          description: User created and token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VmAuthResponse'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Email already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /vessels/auth/login:
    post:
      tags: [VesselMarketplace]
      operationId: vmLogin
      summary: Authenticate a marketplace user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VmLoginRequest'
      responses:
        '200':
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VmAuthResponse'
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  # ── Vessels ───────────────────────────────────────────────────────────────
  /vessels:
    get:
      tags: [VesselMarketplace]
      operationId: listVessels
      summary: Browse all vessels (public)
      description: Returns all vessels with optional filter parameters. No authentication required.
      parameters:
        - name: vesselType
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema:
            type: string
            enum: [available, on_hire, laid_up, decommissioned]
        - name: tradingArea
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
      responses:
        '200':
          description: List of vessels.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vessel'
    post:
      tags: [VesselMarketplace]
      operationId: createVessel
      summary: Create a vessel listing (owner/admin only)
      security:
        - vesselBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VesselUpsert'
      responses:
        '201':
          description: Vessel created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vessel'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Role not permitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /vessels/{id}:
    get:
      tags: [VesselMarketplace]
      operationId: getVessel
      summary: Get vessel detail (contacts shown to authenticated users only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Vessel detail with contacts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VesselDetail'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    put:
      tags: [VesselMarketplace]
      operationId: updateVessel
      summary: Update a vessel listing
      security:
        - vesselBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VesselUpsert'
      responses:
        '200':
          description: Vessel updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vessel'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /vessels/{id}/status:
    patch:
      tags: [VesselMarketplace]
      operationId: setVesselStatus
      summary: Change vessel status (owner/admin, not while on_hire)
      security:
        - vesselBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [available, laid_up, decommissioned]
      responses:
        '200':
          description: Status updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vessel'
        '400':
          description: Invalid status or vessel on hire.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /vessels/{id}/charter:
    post:
      tags: [VesselMarketplace]
      operationId: submitCharterEnquiry
      summary: Submit a charter enquiry (client/broker only)
      description: Owners cannot charter their own or others' vessels. Returns a new charter party in enquiry status.
      security:
        - vesselBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CharterPartyUpsert'
      responses:
        '201':
          description: Enquiry submitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharterParty'
        '400':
          description: Vessel not available or invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Role not permitted (owners cannot submit charters).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  # ── Charter Parties ───────────────────────────────────────────────────────
  /charter-parties:
    get:
      tags: [VesselMarketplace]
      operationId: listCharterParties
      summary: List charter parties for current user (owner or charterer)
      description: Admins see all parties. Others see only those they are party to.
      security:
        - vesselBearerAuth: []
      responses:
        '200':
          description: Charter parties with vessel and party names.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CharterParty'
  /charter-parties/{id}:
    put:
      tags: [VesselMarketplace]
      operationId: updateCharterParty
      summary: Propose updated terms (enquiry or negotiating only)
      description: Resets both parties' confirmation timestamps and sets status to negotiating.
      security:
        - vesselBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CharterPartyUpsert'
      responses:
        '200':
          description: Updated charter party.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharterParty'
        '400':
          description: Cannot edit in current status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /charter-parties/{id}/confirm:
    post:
      tags: [VesselMarketplace]
      operationId: confirmCharterParty
      summary: Record the current party's confirmation
      description: |
        Each party (owner and charterer) calls this independently. Once both
        have confirmed, the charter goes active and the vessel status becomes
        on_hire. If another active/confirmed charter already exists for the
        same vessel, the request returns 409.
      security:
        - vesselBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Confirmation recorded (or charter activated if both confirmed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharterParty'
        '400':
          description: Cannot confirm in current status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Vessel already has an active or confirmed charter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /charter-parties/{id}/decline:
    post:
      tags: [VesselMarketplace]
      operationId: declineCharterParty
      summary: Decline the charter enquiry or negotiation
      description: |
        Either party may decline an enquiry or negotiation in progress. This
        sets status to declined and notifies the other party. Declined charters
        are final — a new enquiry must be submitted to restart the process.
      security:
        - vesselBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Charter party declined.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharterParty'
        '400':
          description: Can only decline enquiries or negotiations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /charter-parties/{id}/terminate:
    post:
      tags: [VesselMarketplace]
      operationId: terminateCharterParty
      summary: Terminate an active hire (owner/admin only)
      description: Returns the vessel to available status and notifies the charterer.
      security:
        - vesselBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Charter terminated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharterParty'
        '400':
          description: Only active charters can be terminated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Only vessel owner or admin can terminate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  # ── Notifications ─────────────────────────────────────────────────────────
  /vessel-notifications:
    get:
      tags: [VesselMarketplace]
      operationId: listVesselNotifications
      summary: List notifications for the current user
      security:
        - vesselBearerAuth: []
      responses:
        '200':
          description: Notifications sorted newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VesselNotification'
  /vessel-notifications/read-all:
    post:
      tags: [VesselMarketplace]
      operationId: markAllNotificationsRead
      summary: Mark all notifications read
      security:
        - vesselBearerAuth: []
      responses:
        '200':
          description: All marked read.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
  /vessel-notifications/{id}/read:
    patch:
      tags: [VesselMarketplace]
      operationId: markNotificationRead
      summary: Mark a single notification read
      security:
        - vesselBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Notification marked read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VesselNotification'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  # ── Admin ─────────────────────────────────────────────────────────────────
  /vessel-admin/users:
    get:
      tags: [VesselMarketplace]
      operationId: listVesselAdminUsers
      summary: List all marketplace users (admin only)
      security:
        - vesselBearerAuth: []
      responses:
        '200':
          description: All users without password fields.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VmUser'
  /vessel-admin/users/{id}/role:
    patch:
      tags: [VesselMarketplace]
      operationId: updateVesselUserRole
      summary: Update a user's role (admin only)
      security:
        - vesselBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [client, broker, owner, admin]
      responses:
        '200':
          description: User role updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VmUser'
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  securitySchemes:
    vesselBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued by POST /vessels/auth/login or /vessels/auth/register with scope "vessel"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
        objectPath:
          type: string
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    # ── Vessel Marketplace ─────────────────────────────────────────────────
    VmRegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, format: email }
        password: { type: string, minLength: 6 }
        role:
          type: string
          enum: [client, broker, owner]
          default: client
        company: { type: string }
        phone: { type: string }
    VmLoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    VmUser:
      type: object
      required: [id, name, email, role, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        role:
          type: string
          enum: [client, broker, owner, admin]
        company: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    VmAuthResponse:
      type: object
      required: [token, user]
      properties:
        token: { type: string }
        user:
          $ref: '#/components/schemas/VmUser'
    VesselStatus:
      type: string
      enum: [available, on_hire, laid_up, decommissioned]
    CharterStatus:
      type: string
      enum: [enquiry, negotiating, confirmed, active, declined, terminated]
    VesselContact:
      type: object
      required: [id, vesselId, contactName]
      properties:
        id: { type: integer }
        vesselId: { type: integer }
        contactName: { type: string }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        address: { type: string, nullable: true }
    Vessel:
      type: object
      required: [id, ownerId, name, vesselType, status, createdAt, updatedAt]
      properties:
        id: { type: integer }
        ownerId: { type: integer }
        name: { type: string }
        imoNumber: { type: string, nullable: true }
        vesselType: { type: string }
        flag: { type: string, nullable: true }
        dwt: { type: string, nullable: true }
        grt: { type: string, nullable: true }
        yearBuilt: { type: integer, nullable: true }
        loa: { type: string, nullable: true }
        beam: { type: string, nullable: true }
        draft: { type: string, nullable: true }
        classificationSociety: { type: string, nullable: true }
        tradingArea: { type: string, nullable: true }
        description: { type: string, nullable: true }
        status:
          $ref: '#/components/schemas/VesselStatus'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        ownerName: { type: string, nullable: true }
    VesselDetail:
      allOf:
        - $ref: '#/components/schemas/Vessel'
        - type: object
          properties:
            contacts:
              type: array
              items:
                $ref: '#/components/schemas/VesselContact'
    VesselUpsert:
      type: object
      required: [name, vesselType]
      properties:
        name: { type: string, minLength: 1 }
        imoNumber: { type: string, nullable: true }
        vesselType: { type: string }
        flag: { type: string, nullable: true }
        dwt: { type: string, nullable: true }
        grt: { type: string, nullable: true }
        yearBuilt: { type: integer, nullable: true }
        loa: { type: string, nullable: true }
        beam: { type: string, nullable: true }
        draft: { type: string, nullable: true }
        classificationSociety: { type: string, nullable: true }
        tradingArea: { type: string, nullable: true }
        description: { type: string, nullable: true }
        status:
          $ref: '#/components/schemas/VesselStatus'
        contacts:
          type: array
          items:
            type: object
            required: [contactName]
            properties:
              contactName: { type: string }
              phone: { type: string, nullable: true }
              email: { type: string, nullable: true }
              address: { type: string, nullable: true }
    CharterParty:
      type: object
      required: [id, vesselId, chartererId, ownerId, status, createdAt, updatedAt]
      properties:
        id: { type: integer }
        vesselId: { type: integer }
        chartererId: { type: integer }
        ownerId: { type: integer }
        rate: { type: string, nullable: true }
        rateCurrency: { type: string, nullable: true }
        rateBasis: { type: string, nullable: true }
        laycanEarliest: { type: string, format: date-time, nullable: true }
        laycanLatest: { type: string, format: date-time, nullable: true }
        durationDays: { type: integer, nullable: true }
        cargoPurpose: { type: string, nullable: true }
        terms: { type: string, nullable: true }
        status:
          $ref: '#/components/schemas/CharterStatus'
        ownerConfirmedAt: { type: string, format: date-time, nullable: true }
        chartererConfirmedAt: { type: string, format: date-time, nullable: true }
        hireStart: { type: string, format: date-time, nullable: true }
        hireEnd: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        vesselName: { type: string, nullable: true }
        chartererName: { type: string, nullable: true }
        ownerName: { type: string, nullable: true }
    CharterPartyUpsert:
      type: object
      properties:
        rate: { type: number, nullable: true }
        rateCurrency: { type: string, default: USD }
        rateBasis: { type: string, nullable: true }
        laycanEarliest: { type: string, format: date-time, nullable: true }
        laycanLatest: { type: string, format: date-time, nullable: true }
        durationDays: { type: integer, nullable: true }
        cargoPurpose: { type: string, nullable: true }
        terms: { type: string, nullable: true }
    VesselNotification:
      type: object
      required: [id, userId, type, title, message, read, createdAt]
      properties:
        id: { type: integer }
        userId: { type: integer }
        type: { type: string }
        title: { type: string }
        message: { type: string }
        relatedId: { type: integer, nullable: true }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }
