openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Storage
    description: File upload and download endpoints (files are stored in PostgreSQL).
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /storage/uploads:
    post:
      tags: [Storage]
      operationId: uploadFile
      summary: Upload a file and store it in PostgreSQL
      description: |
        The request body is the raw file (send it as application/octet-stream,
        maximum 20 MB). Pass the original file name URI-encoded in X-File-Name
        and its MIME type in X-File-Type. X-File-Category and X-Related-Id link
        the file to the app record it belongs to.
      parameters:
        - name: X-File-Name
          in: header
          required: false
          schema:
            type: string
        - name: X-File-Type
          in: header
          required: false
          schema:
            type: string
        - name: X-File-Category
          in: header
          required: false
          schema:
            $ref: '#/components/schemas/FileCategory'
        - name: X-Related-Id
          in: header
          required: false
          schema:
            type: string
            maxLength: 120
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: File stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoredFile'
        '400':
          description: Empty or unreadable file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: File is larger than 20 MB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an uploaded file stored in PostgreSQL
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /state/pump-reports/{id}/delete:
    post:
      tags: [State]
      operationId: deleteApprovedPumpReport
      summary: Delete an approved wrong-date pump report for re-entry
      description: Admin-only. Atomically removes the approved report and linked sale, reverses its tank-sale effect, and restores the opening meter for a replacement entry.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Approved report removed and pump reset for re-entry.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        '400':
          description: Invalid report ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Admin permission required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Report not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Report is not approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    FileCategory:
      type: string
      enum: [general, my_folder, meeting_minutes, hr_enrollment, hr_document, hr_handbook, delivery_evidence, chat_media]
    StoredFile:
      type: object
      required: [objectPath, name, contentType, size, category]
      properties:
        objectPath:
          type: string
        name:
          type: string
        contentType:
          type: string
        size:
          type: integer
        category:
          $ref: '#/components/schemas/FileCategory'
        relatedId:
          type: string
          nullable: true
        branchId:
          type: string
          nullable: true
        uploadedBy:
          type: string
          nullable: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
